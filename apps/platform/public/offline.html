<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03111c" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · SportLeagues</title>
    <style>
      html, body { margin: 0; height: 100%; background: #03111c; color: #e8f1f8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 20px; }
      h1 { margin: 0; font-size: 1.4rem; }
      p { margin: 0; max-width: 32ch; line-height: 1.5; color: #a9bccb; }
      button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #22c55e; color: #03111c; font-size: 1rem; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #e8f1f8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectar con SportLeagues. Revisa tu conexión a internet e inténtalo de nuevo. Tus pronósticos se guardan solo cuando hay conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
